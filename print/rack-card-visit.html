<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Visitor rack card – German-Inspired Home in Perryville</title>
<style>
  /* Visitor rack card for tourist racks (Shrine gift shop, welcome center, heritage sites); ?qr=shrine prints the Shrine's own QR code.
     One rack card = 4 x 9 in (brochure-rack size). ?up=2 places two side by side on a portrait US Letter sheet with cut marks. */
  @page { margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Helvetica Neue", Arial, sans-serif; color: #1f2328; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sheet { display: flex; }
  .sheet.up2 { width: 8.5in; height: 11in; padding: 1in .25in; gap: 0; position: relative; }
  .sheet.up2 .card { outline: .5pt dashed #b9b4a8; }
  .card { width: 4in; height: 9in; display: flex; flex-direction: column; overflow: hidden; background: #fafaf7; }
  .photo { position: relative; height: 3.3in; background: url("../images/house.jpg") center 78% / cover no-repeat; }
  .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,18,30,.85), rgba(10,18,30,0) 60%); }
  .photo .title { position: absolute; left: .25in; right: .25in; bottom: .18in; z-index: 1; color: #fff; }
  .eyebrow { font-size: 6.6pt; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: #e7e2d6; margin: 0 0 3pt; }
  h1 { font-family: "Gelasio", Georgia, serif; font-size: 17.5pt; line-height: 1.05; margin: 0 0 4pt; font-weight: 600; }
  .sub { font-size: 8.6pt; margin: 0; line-height: 1.3; }
  .body { flex: 1; padding: .18in .25in .2in; display: flex; flex-direction: column; gap: .13in; }
  .features { margin: 0; padding: 0; list-style: none; display: grid; gap: 4pt; }
  .features li { font-size: 8.6pt; line-height: 1.3; color: #3d434a; padding-left: 11pt; position: relative; }
  .features li::before { content: ""; position: absolute; left: 0; top: 3.5pt; width: 5pt; height: 5pt; border-radius: 50%; background: #1f3a5f; }
  .features b { color: #1f3a5f; }
  .strip { display: grid; grid-template-columns: 1fr 1fr; gap: .08in; }
  .strip img { width: 100%; height: .95in; object-fit: cover; filter: brightness(1.08) contrast(1.04); border-radius: 4pt; display: block; }
  .offers { display: grid; gap: .06in; }
  .offer { background: #1f3a5f; color: #fff; border-radius: 5pt; padding: 5pt 9pt; display: flex; align-items: baseline; gap: 7pt; }
  .offer b { font-family: "Gelasio", Georgia, serif; font-size: 13pt; white-space: nowrap; }
  .offer span { font-size: 8pt; }
  .near { font-size: 8.2pt; line-height: 1.35; color: #3d434a; margin: 2pt 0 0; }
  .bottom { margin-top: auto; display: flex; gap: .14in; align-items: center; border-top: 1px solid #ddd9d0; padding-top: .14in; }
  .qr { width: 1.25in; height: 1.25in; flex: none; background: #fff; padding: 3pt; border-radius: 4pt; border: 1px solid #ddd9d0; }
  .qr img { width: 100%; height: 100%; display: block; }
  .cta h2 { font-family: "Gelasio", Georgia, serif; font-size: 11pt; margin: 0 0 2pt; color: #1f3a5f; }
  .cta .url { font-size: 12.5pt; font-weight: 700; margin: 0 0 3pt; }
  .cta p { font-size: 7.4pt; margin: 0; color: #3d434a; line-height: 1.3; }
  .cta .drive { font-size: 7pt; color: #6b7178; margin: 3pt 0 0; line-height: 1.3; text-wrap: balance; }
  /* Small code in the corner showing which tracking QR code this print carries (perryvillestay.com/q/<code>). */
  .qr-tag { position: absolute; right: .08in; bottom: .08in; font: 4.0pt/1 "Helvetica Neue", Arial, sans-serif; color: #a7a39a; letter-spacing: .04em; }
  .photo .qr-tag { top: auto; left: auto; right: .1in; bottom: .1in; writing-mode: vertical-rl; transform: rotate(180deg); color: rgba(255,255,255,.8); text-shadow: 0 0 1.5px rgba(0,0,0,.6); z-index: 2; }
  .band { margin: 0; background: #1f3a5f; color: #fff; border-radius: 5pt; padding: 6pt 9pt; font-size: 8.6pt; font-weight: 700; text-align: center; line-height: 1.3; }
  .titlebar { flex: none; background: #1f3a5f; color: #fff; padding: .13in .25in .15in; }
  .titlebar .sub { color: #fff; }
  .titlebar .title { position: static; }
  .photo::after { display: none; }
  .facts { font-size: 7.6pt; margin: 2pt 0 0; color: #e7e2d6; font-weight: 600; }
  /* Gelasio (SIL Open Font License, fonts/Gelasio-OFL-LICENSE.txt), metrically close to Georgia, embedded so every PDF uses the same serif. */
  @font-face { font-family: "Gelasio"; src: url("fonts/gelasio-latin-600-normal.woff2") format("woff2"); font-weight: 400 600; }
  @font-face { font-family: "Gelasio"; src: url("fonts/gelasio-latin-700-normal.woff2") format("woff2"); font-weight: 700 900; }
  p, li, h1, h2, h3 { text-wrap: pretty; }
  .nw { white-space: nowrap; }
  .cta .rating { font-size: 7.4pt; font-weight: 700; color: #1f3a5f; margin: 0 0 2pt; }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<template id="tpl">
  <div class="card">
    <div class="photo">
    </div>
    <div class="titlebar">
      <div class="title">
        <h1>Visiting Perryville?<br>Your own house, not a room.</h1>
        <p class="sub">Whole furnished house · stays of 2 nights or more</p>
        <p class="facts">1 bedroom · 1 queen bed · free driveway parking</p>
      </div>
    </div>
    <div class="body">
      <ul class="features">
        <li><b>Whole house to yourself</b> – nothing shared, quiet street</li>
        <li><b>Full kitchen</b>, washer&nbsp;and&nbsp;dryer, fast <span class="nw">Wi-Fi</span></li>
        <li><b>Self check-in</b> any time after 4 pm, even midnight</li>
      </ul>
      <div class="strip">
        <img src="../images/kitchen-800.jpg" alt="">
        <img src="../images/bedroom-desk-800.jpg" alt="">
      </div>
      <p class="near"><b>Nearby:</b> the National Shrine of Our Lady of the Miraculous Medal, Missouri's National Veterans Memorial and the Saxon Lutheran heritage sites in Altenburg and Frohna.</p>
      <p class="band">Longer stay? Weekly &amp; monthly discounts apply automatically</p>
      <div class="bottom">
        <div class="qr"><img src="qr-q-rack-visit.svg" alt="QR code to perryvillestay.com"></div>
        <div class="cta">
          <h2>Scan for current rates — then book on Airbnb</h2>
          <p class="url">perryvillestay.com</p>
          <p class="rating"><span class="nw">★ 4.9+ from 39+ reviews</span> · <span class="nw">Guest Favorite on Airbnb</span></p>
          <p>Messages through Airbnb, too.</p>
          <p class="drive">Approx. drive times: National&nbsp;Shrine&nbsp;4&nbsp;min · downtown&nbsp;square&nbsp;2&nbsp;min · Aldi&nbsp;4&nbsp;min</p>
</div>
      </div>
    </div>
  </div>
</template>
<script>
  const up = new URLSearchParams(location.search).get('up') === '2' ? 2 : 1;
  const s = document.getElementById('sheet'), t = document.getElementById('tpl');
  if (up === 2) s.classList.add('up2');
  for (let i = 0; i < up; i++) s.appendChild(t.content.cloneNode(true));
</script>
<script>
  // ?qr=shrine prints the Shrine's own QR code (perryvillestay.com/q/rack-shrine).
  if (new URLSearchParams(location.search).get('qr') === 'shrine') document.querySelectorAll('.qr img').forEach(img => img.src = 'qr-q-rack-shrine.svg');
</script>
<script>
  // Label each page/card with its QR code name, read from the QR image file (qr-q-<code>.svg).
  document.querySelectorAll('.qr img').forEach(img => {
    const m = (img.getAttribute('src') || '').match(/qr-q-([a-z-]+)\.svg/);
    const box = img.closest('.page, .card');
    if (!m || !box) return;
    const host = box.querySelector('.photo') || box;   // inside the photo where there is one
    if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
    const t = document.createElement('span'); t.className = 'qr-tag'; const LABEL = {"flyer": "FL", "bw": "BW", "board": "TB", "half": "HF", "rack": "RK", "rack-visit": "RV", "rack-shrine": "RS", "photo": "PC", "card": "BC", "tg": "FT", "mercy": "FM", "gilster": "FG", "air": "FA", "chamber": "FC", "shrine": "FS", "card-tg": "CT", "card-mercy": "CM", "card-gilster": "CG", "card-air": "CA", "card-chamber": "CC", "card-shrine": "CS"}; t.textContent = LABEL[m[1]] || m[1]; host.appendChild(t);
  });
</script>
</body>
</html>
