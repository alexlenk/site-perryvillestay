<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Half-page flyer – German-Inspired Home in Perryville</title>
<style>
  /* One flyer = 5.5 x 8.5 in (half US Letter). ?up=2 puts two side by side on a landscape Letter sheet with a cut line. */
  @page { margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Helvetica Neue", Arial, sans-serif; color: #1f2328; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sheet { display: flex; }
  .sheet.up2 .page + .page { border-left: .5pt dashed #b9b4a8; }
  .page { width: 5.5in; height: 8.5in; display: flex; flex-direction: column; overflow: hidden; background: #fafaf7; }
  .photo { position: relative; flex: none; height: 2.95in; background: url("../images/house.jpg") center 60% / cover no-repeat; }
  .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,18,30,.85), rgba(10,18,30,0) 60%); }
  .photo .title { position: absolute; left: .35in; right: .35in; bottom: .2in; z-index: 1; color: #fff; }
  .eyebrow { font-size: 7.5pt; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: #e7e2d6; margin: 0 0 3pt; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 21pt; line-height: 1.05; margin: 0 0 5pt; font-weight: 600; }
  .sub { font-size: 10pt; margin: 0; }
  .body { flex: 1; padding: .18in .35in .2in; display: flex; flex-direction: column; gap: .11in; }
  .features { margin: 0; padding: 0; list-style: none; display: grid; gap: 5pt; }
  .features li { font-size: 9.5pt; line-height: 1.3; color: #3d434a; padding-left: 13pt; position: relative; }
  .features li::before { content: ""; position: absolute; left: 0; top: 4pt; width: 6pt; height: 6pt; border-radius: 50%; background: #1f3a5f; }
  .features b { color: #1f3a5f; }
  .offers { display: grid; grid-template-columns: repeat(3, 1fr); gap: .1in; }
  .offer { background: #1f3a5f; color: #fff; border-radius: 6pt; padding: 7pt 8pt; }
  .offer b { display: block; font-family: Georgia, serif; font-size: 15pt; line-height: 1; margin-bottom: 3pt; }
  .offer span { font-size: 7.5pt; line-height: 1.25; display: block; }
  .strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: .1in; }
  .strip img { width: 100%; height: .85in; object-fit: cover; border-radius: 5pt; display: block; }
  .bottom { display: flex; gap: .18in; align-items: center; margin-top: auto; border-top: 1px solid #ddd9d0; padding-top: .16in; }
  .qr { width: 1.35in; height: 1.35in; flex: none; background: #fff; padding: 3pt; border-radius: 5pt; border: 1px solid #ddd9d0; }
  .qr img { width: 100%; height: 100%; display: block; }
  .cta h2 { font-family: Georgia, serif; font-size: 12.5pt; margin: 0 0 2pt; color: #1f3a5f; }
  .cta .url { font-size: 15pt; font-weight: 700; margin: 0 0 4pt; }
  .cta p { font-size: 8pt; margin: 0 0 2pt; color: #3d434a; line-height: 1.3; }
  .small { font-size: 7pt !important; color: #6b7178 !important; }
  .drive p { font-size: 6.8pt; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: #6b7178; margin: 0 0 3pt; }
  .drive-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .08in; }
  .drive-grid div { background: #fff; border: 1px solid #ddd9d0; border-radius: 5pt; padding: 4pt 6pt; }
  .drive-grid b { display: block; font-family: Georgia, serif; font-size: 11pt; color: #1f3a5f; line-height: 1.1; }
  .drive-grid span { font-size: 7pt; color: #3d434a; line-height: 1.2; display: block; }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<template id="tpl">
  <div class="page">
    <div class="photo">
      <div class="title">
        <p class="eyebrow">Perryville, Missouri</p>
        <h1>German-Inspired Home in Perryville</h1>
        <p class="sub">Your own private house for work stays – a week, a month or longer.</p>
      </div>
    </div>
    <div class="body">
      <ul class="features">
        <li><b>Work from the house:</b> dedicated desk with an ergonomic chair, fast Spectrum internet</li>
        <li><b>Live like at home:</b> full kitchen with dishwasher, your own washer and dryer</li>
        <li><b>Arrive on your schedule:</b> self check-in from 4 pm – nothing shared with other guests</li>
      </ul>
      <div class="offers">
        <div class="offer"><b>25 % off</b><span>stays of 7+ nights</span></div>
        <div class="offer"><b>30 % off</b><span>stays of 28+ nights</span></div>
        <div class="offer"><b>No county tax</b><span>from 32 nights</span></div>
      </div>
      <div class="drive"><p>Approx. drive times from the house</p><div class="drive-grid"><div><b>5 min</b><span>TG Missouri</span></div><div><b>4 min</b><span>National Shrine</span></div><div><b>2 min</b><span>Downtown square</span></div><div><b>4 min</b><span>Aldi grocery store</span></div></div></div>
      <div class="strip">
        <img src="../images/kitchen-800.jpg" alt="">
        <img src="../images/bedroom-desk-800.jpg" alt="">
        <img src="../images/living-dining-800.jpg" alt="">
      </div>
      <div class="bottom">
        <div class="qr"><img src="qr-flyer.svg" alt="QR code to perryvillestay.com"></div>
        <div class="cta">
          <h2>Photos, dates &amp; booking</h2>
          <p class="url">perryvillestay.com</p>
          <p>Booking and messages through Airbnb – discounts apply automatically, receipts for your company in your Airbnb account.</p>
          <p class="small">Guest Favorite on Airbnb · minimalist European style</p>
        </div>
      </div>
    </div>
  </div>
</template>
<script>
  const up = new URLSearchParams(location.search).get('up') === '2' ? 2 : 1;
  const s = document.getElementById('sheet'), t = document.getElementById('tpl');
  if (up === 2) s.classList.add('up2');
  for (let i = 0; i < up; i++) s.appendChild(t.content.cloneNode(true));
</script>
</body>
</html>
