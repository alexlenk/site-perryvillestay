<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Half-page flyer – German-Inspired Home in Perryville</title>
<style>
  /* One flyer = 5.5 x 8.5 in (half US Letter). ?up=2 puts two side by side on a landscape Letter sheet with a cut line. */
  @page { margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Helvetica Neue", Arial, sans-serif; color: #1f2328; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sheet { display: flex; }
  .sheet.up2 .page + .page { border-left: .5pt dashed #b9b4a8; }
  .page { width: 5.5in; height: 8.5in; display: flex; flex-direction: column; overflow: hidden; background: #fafaf7; }
  .photo { position: relative; flex: none; height: 2.22in; background: url("../images/house.jpg") center 42% / cover no-repeat; }
  .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,18,30,.85), rgba(10,18,30,0) 60%); }
  .photo .title { position: absolute; left: .35in; right: .35in; bottom: .2in; z-index: 1; color: #fff; }
  .eyebrow { font-size: 7.5pt; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: #e7e2d6; margin: 0 0 3pt; }
  h1 { font-family: "Gelasio", Georgia, serif; font-size: 24pt; line-height: 1.02; margin: 0 0 4pt; font-weight: 600; }
  .sub { font-size: 11.5pt; margin: 0; }
  .body { flex: 1; padding: .14in .35in .22in; display: flex; flex-direction: column; gap: .11in; }
  .features { margin: 0; padding: 0; list-style: none; display: grid; gap: 5pt; }
  .features li { font-size: 9.5pt; line-height: 1.3; color: #3d434a; padding-left: 13pt; position: relative; }
  .features li::before { content: ""; position: absolute; left: 0; top: 4pt; width: 6pt; height: 6pt; border-radius: 50%; background: #1f3a5f; }
  .features b { color: #1f3a5f; }
  .offers { display: grid; grid-template-columns: repeat(3, 1fr); gap: .1in; }
  .offer { background: #1f3a5f; color: #fff; border-radius: 6pt; padding: 7pt 8pt; }
  .offer b { display: block; font-family: "Gelasio", Georgia, serif; font-size: 15pt; line-height: 1; margin-bottom: 3pt; }
  .offer span { font-size: 7.5pt; line-height: 1.25; display: block; }
  .strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: .1in; }
  .strip img { width: 100%; height: .95in; object-fit: cover; filter: brightness(1.08) contrast(1.04); border-radius: 5pt; display: block; }
  .bottom { display: flex; gap: .18in; align-items: center; margin-top: auto; border-top: 1px solid #ddd9d0; padding-top: .16in; }
  .qr { width: 1.35in; height: 1.35in; flex: none; background: #fff; padding: 3pt; border-radius: 5pt; border: 1px solid #ddd9d0; }
  .qr img { width: 100%; height: 100%; display: block; }
  .cta h2 { font-family: "Gelasio", Georgia, serif; font-size: 12.5pt; margin: 0 0 2pt; color: #1f3a5f; }
  .cta .url { font-size: 15pt; font-weight: 700; margin: 0 0 4pt; }
  .cta p { font-size: 8pt; margin: 0 0 2pt; color: #3d434a; line-height: 1.3; }
  .small { font-size: 7pt !important; color: #6b7178 !important; }
  .cta .drive { font-size: 7.2pt; color: #6b7178; margin: 3pt 0 0; line-height: 1.3; text-wrap: balance; }
  /* Small code in the corner showing which tracking QR code this print carries (perryvillestay.com/q/<code>). */
  .qr-tag { position: absolute; right: .26in; bottom: .32in; writing-mode: vertical-rl; transform: rotate(180deg); font: 4.0pt/1 "Helvetica Neue", Arial, sans-serif; color: #a7a39a; letter-spacing: .04em; }
  .photo .qr-tag { top: auto; left: auto; right: .3in; bottom: .1in; writing-mode: vertical-rl; transform: rotate(180deg); color: rgba(255,255,255,.8); text-shadow: 0 0 1.5px rgba(0,0,0,.6); z-index: 2; }
  .band { margin: 0; background: #1f3a5f; color: #fff; border-radius: 6pt; padding: 6pt 9pt; font-size: 8.6pt; font-weight: 700; text-align: center; line-height: 1.3; }
  .titlebar { flex: none; background: #1f3a5f; color: #fff; padding: .14in .35in .16in; }
  .titlebar .sub { color: #fff; }
  .titlebar .title { position: static; }
  .photo::after { display: none; }
  .facts { font-size: 9pt; margin: 3pt 0 0; color: #e7e2d6; font-weight: 600; }
  /* Gelasio (SIL Open Font License, fonts/Gelasio-OFL-LICENSE.txt), metrically close to Georgia, embedded so every PDF uses the same serif. */
  @font-face { font-family: "Gelasio"; src: url("fonts/gelasio-latin-600-normal.woff2") format("woff2"); font-weight: 400 600; }
  @font-face { font-family: "Gelasio"; src: url("fonts/gelasio-latin-700-normal.woff2") format("woff2"); font-weight: 700 900; }
  p, li, h1, h2, h3 { text-wrap: pretty; }
  .nw { white-space: nowrap; }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<template id="tpl">
  <div class="page">
    <div class="photo">
    </div>
    <div class="titlebar">
      <div class="title">
        <p class="eyebrow">★ 4.9+ from 39+ reviews · Guest Favorite on Airbnb</p>
        <h1>In town for work?<br>Your own house, not a room.</h1>
        <p class="sub">Whole furnished house in Perryville · weekly &amp; monthly stays</p>
        <p class="facts">1 bedroom · 1 queen bed · free driveway parking</p>
      </div>
    </div>
    <div class="body">
      <ul class="features">
        <li><b>Work from the house:</b> dedicated desk with an ergonomic chair, fast <span class="nw">Wi-Fi</span></li>
        <li><b>Live like at home:</b> full kitchen with dishwasher, your own washer&nbsp;and&nbsp;dryer</li>
        <li><b>Arrive on your schedule:</b> self check-in any time after 4 pm, even midnight – nothing shared with other guests</li>
      </ul>
      <p class="band">A whole house for the price of a budget hotel · Weekly &amp; monthly discounts</p>
      <div class="strip">
        <img src="../images/kitchen-800.jpg" alt="">
        <img src="../images/bedroom-desk-800.jpg" alt="">
        <img src="../images/living-dining-800.jpg" alt="">
      </div>
      <div class="bottom">
        <div class="qr"><img src="qr-q-half.svg" alt="QR code to perryvillestay.com"></div>
        <div class="cta">
          <h2>Scan for current rates — then book on Airbnb</h2>
          <p class="url">perryvillestay.com</p>
          <p>Messages through Airbnb, too. Discounts apply automatically; itemized receipts for your expense report.</p>
          <p class="small">Modern, clean European-style interior</p>
          <p class="drive">Approx. drive times: TG&nbsp;Missouri&nbsp;plant&nbsp;5&nbsp;min · National&nbsp;Shrine&nbsp;4&nbsp;min · downtown&nbsp;square&nbsp;2&nbsp;min · Aldi&nbsp;4&nbsp;min</p>
</div>
      </div>
    </div>
  </div>
</template>
<script>
  const up = new URLSearchParams(location.search).get('up') === '2' ? 2 : 1;
  const s = document.getElementById('sheet'), t = document.getElementById('tpl');
  if (up === 2) s.classList.add('up2');
  for (let i = 0; i < up; i++) s.appendChild(t.content.cloneNode(true));
</script>
<script>
  // Label each page/card with its QR code name, read from the QR image file (qr-q-<code>.svg).
  document.querySelectorAll('.qr img').forEach(img => {
    const m = (img.getAttribute('src') || '').match(/qr-q-([a-z-]+)\.svg/);
    const box = img.closest('.page, .card');
    if (!m || !box) return;
    const host = box.querySelector('.photo') || box;   // inside the photo where there is one
    if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
    const t = document.createElement('span'); t.className = 'qr-tag'; const LABEL = {"flyer": "FL", "bw": "BW", "board": "TB", "half": "HF", "rack": "RK", "rack-visit": "RV", "rack-shrine": "RS", "photo": "PC", "card": "BC", "tg": "FT", "mercy": "FM", "gilster": "FG", "air": "FA", "chamber": "FC", "shrine": "FS", "card-tg": "CT", "card-mercy": "CM", "card-gilster": "CG", "card-air": "CA", "card-chamber": "CC", "card-shrine": "CS"}; t.textContent = LABEL[m[1]] || m[1]; host.appendChild(t);
  });
</script>
</body>
</html>
