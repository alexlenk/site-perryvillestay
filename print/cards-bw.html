<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Business cards (black and white) – German-Inspired Home in Perryville</title>
<style>
  /* Black-and-white business cards for laser printers, 10 per sheet.
     ?paper=letter (default): US cards 3.5 x 2 in, 0.75 in side / 0.5 in top margins.
     ?paper=a4: EU cards 85 x 55 mm, 20 mm side / 11 mm top margins.
     Compare with the template of your perforated card sheets before printing. */
  @page { margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; }
  body { font-family: "Helvetica Neue", Arial, sans-serif; color: #000; }
  .sheet { display: grid; }
  .card { display: flex; align-items: center; outline: .4pt dashed #bbb; background: #fff; }
  .text { flex: 1; min-width: 0; }
  .eyebrow { letter-spacing: .14em; text-transform: uppercase; font-weight: 700; margin: 0 0 2pt; color: #333; }
  h1 { font-family: Georgia, "Times New Roman", serif; line-height: 1.1; margin: 0 0 4pt; font-weight: 700; }
  ul { margin: 0 0 4pt; padding-left: 9pt; line-height: 1.35; }
  .offer { font-weight: 700; margin: 0 0 3pt; }
  .url { font-weight: 700; margin: 0; }
  .qr { flex: none; background: #fff; }
  .qr img { width: 100%; height: 100%; display: block; }
  /* Letter / US */
  .letter .sheet { width: 8.5in; height: 11in; padding: .5in .75in; grid-template-columns: 3.5in 3.5in; grid-template-rows: repeat(5, 2in); }
  .letter .card { width: 3.5in; height: 2in; padding: .16in .18in; gap: .14in; }
  .letter .qr { width: 1.05in; height: 1.05in; }
  .letter .eyebrow { font-size: 6.5pt; } .letter h1 { font-size: 12pt; } .letter ul { font-size: 7.2pt; } .letter .offer { font-size: 7.4pt; } .letter .url { font-size: 9.5pt; }
  /* A4 paper with US-size cards (3.5 x 2 in) – for cutting from plain cardstock; centred on the sheet */
  .a4us .sheet { width: 210mm; height: 297mm; padding: 21.5mm 16.1mm; grid-template-columns: 3.5in 3.5in; grid-template-rows: repeat(5, 2in); }
  .a4us .card { width: 3.5in; height: 2in; padding: .16in .18in; gap: .14in; }
  .a4us .qr { width: 1.05in; height: 1.05in; }
  .a4us .eyebrow { font-size: 6.5pt; } .a4us h1 { font-size: 12pt; } .a4us ul { font-size: 7.2pt; } .a4us .offer { font-size: 7.4pt; } .a4us .url { font-size: 9.5pt; }
  /* A4 / EU */
  .a4 .sheet { width: 210mm; height: 297mm; padding: 11mm 20mm; grid-template-columns: 85mm 85mm; grid-template-rows: repeat(5, 55mm); }
  .a4 .card { width: 85mm; height: 55mm; padding: 4mm 4.5mm; gap: 3.5mm; }
  .a4 .qr { width: 27mm; height: 27mm; }
  .a4 .eyebrow { font-size: 6.3pt; } .a4 h1 { font-size: 11.5pt; } .a4 ul { font-size: 7pt; } .a4 .offer { font-size: 7.2pt; } .a4 .url { font-size: 9.2pt; }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<template id="tpl">
  <div class="card">
    <div class="text">
      <p class="eyebrow">Perryville, Missouri</p>
      <h1>German-Inspired Home in Perryville</h1>
      <ul>
        <li>Your own private house for work stays</li>
        <li>Desk, fast Wi-Fi, kitchen, washer &amp; dryer</li>
        <li>Self check-in from 4 pm</li>
      </ul>
      <p class="offer">25 % off weekly · 30 % off monthly</p>
      <p class="url">perryvillestay.com</p>
    </div>
    <div class="qr"><img src="qr-q-card.svg" alt="QR code to perryvillestay.com"></div>
  </div>
</template>
<script>
  const p = new URLSearchParams(location.search).get('paper');
  const paper = p === 'a4' ? 'a4' : p === 'a4us' ? 'a4us' : 'letter';
  document.body.classList.add(paper);
  const s = document.getElementById('sheet'), t = document.getElementById('tpl');
  for (let i = 0; i < 10; i++) s.appendChild(t.content.cloneNode(true));
</script>
</body>
</html>
