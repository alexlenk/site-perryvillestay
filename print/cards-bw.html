<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Business cards (black and white) – German-Inspired Home in Perryville</title>
<style>
  /* Black-and-white business cards for laser printers, 10 per sheet.
     US Letter, US cards 3.5 x 2 in, 0.75 in side / 0.5 in top margins.
     Compare with the template of your perforated card sheets before printing. */
  @page { margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; }
  body { font-family: "Helvetica Neue", Arial, sans-serif; color: #000; }
  .sheet { display: grid; }
  .card { display: flex; align-items: center; outline: .4pt dashed #bbb; background: #fff; }
  .text { flex: 1; min-width: 0; }
  .eyebrow { letter-spacing: .14em; text-transform: uppercase; font-weight: 700; margin: 0 0 2pt; color: #333; }
  h1 { font-family: "Gelasio", Georgia, serif; line-height: 1.1; margin: 0 0 4pt; font-weight: 700; }
  ul { margin: 0 0 4pt; padding-left: 9pt; line-height: 1.35; }
  .offer { font-weight: 700; margin: 0 0 3pt; }
  .url { font-weight: 700; margin: 0; }
  .qr { flex: none; background: #fff; }
  .qr img { width: 100%; height: 100%; display: block; }
  /* Letter / US */
  .letter .sheet { width: 8.5in; height: 11in; padding: .5in .75in; grid-template-columns: 3.5in 3.5in; grid-template-rows: repeat(5, 2in); }
  .letter .card { width: 3.5in; height: 2in; padding: .16in .18in; gap: .14in; }
  .letter .qr { width: 1.05in; height: 1.05in; }
  .letter .eyebrow { font-size: 6.5pt; } .letter h1 { font-size: 9.3pt; } .letter ul { font-size: 7.2pt; } .letter .offer { font-size: 7.4pt; } .letter .url { font-size: 9.5pt; }
  /* Small code in the corner showing which tracking QR code this print carries (perryvillestay.com/q/<code>). */
  .qr-tag { position: absolute; right: .05in; bottom: .05in; font: 3.5pt/1 "Helvetica Neue", Arial, sans-serif; color: #999; letter-spacing: .04em; }
  /* Gelasio (SIL Open Font License, fonts/Gelasio-OFL-LICENSE.txt), metrically close to Georgia, embedded so every PDF uses the same serif. */
  @font-face { font-family: "Gelasio"; src: url("fonts/gelasio-latin-600-normal.woff2") format("woff2"); font-weight: 400 600; }
  @font-face { font-family: "Gelasio"; src: url("fonts/gelasio-latin-700-normal.woff2") format("woff2"); font-weight: 700 900; }
  p, li, h1, h2, h3 { text-wrap: pretty; }
  .nw { white-space: nowrap; }
  .rating { font-size: 6.2pt; font-weight: 700; margin: 2pt 0 0; letter-spacing: .02em; }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<template id="tpl">
  <div class="card">
    <div class="text">
      <h1>In town for work?<br>Your own house, not a room.</h1>
      <ul>
        <li>Furnished house in Perryville</li>
        <li>1 queen bed · driveway parking</li>
        <li>Desk, fast <span class="nw">Wi-Fi</span>, kitchen, laundry</li>
        <li>Self check-in any time after 4 pm</li>
      </ul>
      <p class="offer">Weekly &amp; monthly discounts on Airbnb</p>
      <p class="url">perryvillestay.com</p>
      <p class="rating">★ 4.9+ · Guest Favorite on Airbnb</p>
    </div>
    <div class="qr"><img src="qr-q-card.svg" alt="QR code to perryvillestay.com"></div>
  </div>
</template>
<script>
  const paper = 'letter';
  document.body.classList.add(paper);
  const s = document.getElementById('sheet'), t = document.getElementById('tpl');
  for (let i = 0; i < 10; i++) s.appendChild(t.content.cloneNode(true));
</script>
<script>
  // ?qr=tg|mercy|gilster|air|chamber|shrine prints the cards with a location-specific QR code (perryvillestay.com/q/card-<code>).
  const qrLoc = new URLSearchParams(location.search).get('qr');
  if (qrLoc && /^[a-z]+$/.test(qrLoc)) document.querySelectorAll('.qr img').forEach(img => img.src = 'qr-q-card-' + qrLoc + '.svg');
</script>
<script>
  // Label each page/card with its QR code name, read from the QR image file (qr-q-<code>.svg).
  document.querySelectorAll('.qr img').forEach(img => {
    const m = (img.getAttribute('src') || '').match(/qr-q-([a-z-]+)\.svg/);
    const box = img.closest('.page, .card');
    if (!m || !box) return;
    if (getComputedStyle(box).position === 'static') box.style.position = 'relative';
    const t = document.createElement('span'); t.className = 'qr-tag'; const LABEL = {"flyer": "FL", "bw": "BW", "board": "TB", "half": "HF", "rack": "RK", "rack-visit": "RV", "rack-shrine": "RS", "photo": "PC", "card": "BC", "tg": "FT", "mercy": "FM", "gilster": "FG", "air": "FA", "chamber": "FC", "shrine": "FS", "card-tg": "CT", "card-mercy": "CM", "card-gilster": "CG", "card-air": "CA", "card-chamber": "CC", "card-shrine": "CS"}; t.textContent = LABEL[m[1]] || m[1]; box.appendChild(t);
  });
</script>
</body>
</html>
